<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <input type="datetime-local"> <br><br>
        <label for="fullname">Full Name:</label>
        <input id="fullname" type="text" placeholder="enter your name" /> <br><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="enter your email" id="email"> <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="enter your password"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="enter your age"><br><br>

        <label for="profile">Profile:</label>
        <input type="file" id="profile"><br><br>

        <label for="bio">Bio:</label> <br>
        <textarea cols="20" rows="4" id="bio" placeholder="enter your bio"></textarea>


        
    </form>
</body>
</html>
