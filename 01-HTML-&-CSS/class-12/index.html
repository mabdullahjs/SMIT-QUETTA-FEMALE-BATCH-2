<body>
    <h1>Student Registration Form</h1>

    <!-- <input type="text"> -->

    <fieldset>
        <legend>Student form</legend>
        <form>
            <label for="firstname">first name</label>
            <input id="firstname" type="text" placeholder="enter your name" required> <br><br>

            <label for="lastname">lastname</label>
            <input type="text" id="lastname" placeholder="enter your last name" required><br><br>

            <label for="email">email</label>
            <input type="email" id="email" placeholder="enter your email" required><br><br>

            <label for="age">age</label>
            <input type="number" id="age" placeholder="enter your age" min="18" max="40"><br><br>

            <!-- <input type="submit"> -->
            <button type="submit">submit</button>
        </form>
    </fieldset>
