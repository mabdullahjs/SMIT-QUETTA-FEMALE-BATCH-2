<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snp Main</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <header>
        <div class="header">
            <div class="logo">
                <img class="logo-image"
                    src="https://images-beta.tossdown.com/site/65b73fb7-2706-4440-87b9-9555fcd0ba80.webp"
                    alt="img-logo">
            </div>
            <nav>
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Publications</a>
                <button class="franchise-btn">Get a Franchise</button>
                <button class="order-btn">Order Online <span class="arrow-icon"><i
                            class="fa-solid fa-arrow-right-long"></i></span></button>
            </nav>
            <div class="menu">
                <i class="fa-solid fa-bars menu-icon"></i>
            </div>
        </div>

        <div class="mobile-header">
            <div class="mobile-icon">
                <i class="fa-solid fa-bars mobile-menu-icon"></i>
            </div>
            <div class="mobile-logo">
                <img class="mobile-logo-image"
                    src="https://images-beta.tossdown.com/site/65b73fb7-2706-4440-87b9-9555fcd0ba80.webp"
                    alt="img-logo">
            </div>
            <button class="mobile-order-btn"><span class="mobile-arrow-icon"><i
                        class="fa-solid fa-arrow-right-long"></i></span> Order Online</button>
        </div>
    </header>
    <main>
        <section>
            <!-- carousel started -->
            <img class="carousel-image"
                src="https://static.tossdown.com/images/df4e58f5-296a-4fed-9021-65ed33d8a3ca.webp" alt="carousel-image">
            <!-- carousel ended -->
        </section>
        <section class="our-brand">
            <!-- our brands started -->
            <h1>Welcome to <span class="futurak-font">Salt'n Pepper</span> <br />
                Restaurants! Our Brands</h1>

            <p>Please click our brands below for further information, reservations or to order online!</p>
            <!-- our brands ended -->


            <div class="brand-cards">
                <div class="card">
                    <img class="brand-card-image" src="https://static.tossdown.com/site/8a66dd76-03d2-4b71-8d03-cf045f0248a7.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="https://static.tossdown.com/site/8a66dd76-03d2-4b71-8d03-cf045f0248a7.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="https://static.tossdown.com/site/8a66dd76-03d2-4b71-8d03-cf045f0248a7.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="https://static.tossdown.com/site/8a66dd76-03d2-4b71-8d03-cf045f0248a7.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
            </div>
        </section>
        <section></section>
        <section></section>
    </main>
    <footer></footer>




    <script src="https://kit.fontawesome.com/9aded8b196.js" crossorigin="anonymous"></script>
</body>

</html>
