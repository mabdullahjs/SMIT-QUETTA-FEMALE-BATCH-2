<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul {
            list-style-type: none;
            text-align: end;
            font-size: 2rem;
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
            color: white;
            padding: 20px 50px;
        }

        li {
            display: inline;
            margin: 0px 30px;
            cursor: pointer;
        }

        li:hover {
            color: rgb(249, 92, 92);
        }
    </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
        <li>Services</li>
        <li>Gallery</li>
    </ul>
</body>
</html>
